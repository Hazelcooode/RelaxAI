[project]
name = "relaxai-backend"
version = "0.1.0"
description = "RelaxAI backend: FastAPI modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "python-ulid>=3.0",
    "orjson>=3.10",
    "typer>=0.15",
    "pyjwt[crypto]>=2.10",
]

[project.scripts]
relaxai-admin = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "hypothesis>=6.120",
    "respx>=0.22",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC",
    "DTZ", "T20", "PT", "LOG", "G", "PIE", "RET", "TID",
]
# Error class names are fixed by the contract (NotAvailable, VersionConflict, ...).
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/versions/*" = ["N999"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"

# --------------------------------------------------------------------------- import-linter
# Conventions §2.1: a module may import another module only through its top-level
# package (`app.modules.<x>`), never its internals; platform code is domain-free;
# route adapters never reach repositories or tables.

[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Platform is domain-free"
type = "forbidden"
source_modules = ["app.platform"]
forbidden_modules = ["app.modules", "app.api", "app.container", "app.main_api", "app.cli"]

[[tool.importlinter.contracts]]
name = "Modules do not depend on API, composition root, or entry points"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.api", "app.container", "app.main_api", "app.cli"]

[[tool.importlinter.contracts]]
name = "Route adapters never import repositories or tables"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.modules.*.repository", "app.modules.*.tables"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "organization_access uses other modules only through their public package"
type = "forbidden"
source_modules = ["app.modules.organization_access"]
forbidden_modules = [
    "app.modules.projects.**", "app.modules.intake.**", "app.modules.privacy.**",
    "app.modules.knowledge.**", "app.modules.retrieval.**", "app.modules.intelligence.**",
    "app.modules.actions.**", "app.modules.governance.**",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "projects uses other modules only through their public package"
type = "forbidden"
